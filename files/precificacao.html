<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Precificação — Sistema Comercial</title>
  <link rel="stylesheet" href="../css/app.css"/>
  <style>
    input.prec-input { min-width: 100px; max-width: 120px; text-align: right; }
  </style>
</head>
<body>
<div class="page">

  <nav class="top-menu">
    <a class="menu-link" href="dashboard.html">Dashboard</a>
    <a class="menu-link" href="precificacao.html">Precificação</a>
    <a class="menu-link" href="produtos.html">Produtos</a>
    <a class="menu-link" href="insumos.html">Insumos</a>
    <a class="menu-link" href="configuracoes.html">Configurações</a>
    <a class="menu-link" href="orcamentos.html">Orçamentos</a>
  </nav>

  <div class="card">
    <div class="section-title">Planilha de Precificação</div>
    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Variação</th>
          <th class="text-right">Custo Unit.</th>
          <th class="text-right">Preço Venda</th>
          <th class="text-right">Margem</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tb-prec"></tbody>
    </table>
  </div>

</div>

<script src="../js/app.js"></script>
<script>
async function load() {
  try {
    const data = await apiFetch('/precificacao/json');
    const tbody = clearTable('tb-prec');
    const items = data.items || [];
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhuma variação cadastrada</td></tr>';
      return;
    }
    items.forEach(it => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${it.produtoNome}</td>
        <td>${it.nomeTamanho}</td>
        <td class="text-right td-mono td-blue">${fmt.brl(it.custoUnitarioCalculado)}</td>
        <td><input class="prec-input" type="number" step="0.01" id="preco-${it.variacaoId}" value="${fmt.num(it.precoVenda)}"/></td>
        <td><input class="prec-input" type="number" step="0.01" id="marg-${it.variacaoId}" value="${fmt.num(it.margemLucro)}"/></td>
        <td><button class="btn btn-primary btn-sm" onclick="salvar(${it.variacaoId})">Salvar</button></td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    console.error(e);
    toast('Erro ao carregar precificação', 'error');
  }
}

async function salvar(vid) {
  const preco  = document.getElementById(`preco-${vid}`)?.value ?? '0';
  const margem = document.getElementById(`marg-${vid}`)?.value ?? '0';
  try {
    await apiPostForm('/precificacao/atualizar', {
      variacaoId: String(vid),
      precoVenda: preco,
      margemLucro: margem,
    });
    toast('Precificação salva');
    load();
  } catch (e) { toast('Erro ao salvar', 'error'); }
}

load();
</script>
</body>
</html>
