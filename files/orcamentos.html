<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orçamentos — Sistema Comercial</title>
  <link rel="stylesheet" href="../css/app.css"/>
</head>
<body>
<div class="page">

  <nav class="top-menu">
    <a class="menu-link" href="dashboard.html">Dashboard</a>
    <a class="menu-link" href="precificacao.html">Precificação</a>
    <a class="menu-link" href="produtos.html">Produtos</a>
    <a class="menu-link" href="insumos.html">Insumos</a>
    <a class="menu-link" href="configuracoes.html">Configurações</a>
    <a class="menu-link" href="orcamentos.html">Orçamentos</a>
  </nav>

  <div class="card">
    <div class="section-title">Orçamentos</div>

    <div class="form-row">
      <input type="text" id="orc-titulo" placeholder="Título do orçamento"/>
      <input type="text" id="orc-obs"    placeholder="Observações (opcional)"/>
      <button class="btn btn-primary" id="btn-add">+ Criar orçamento</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Título</th>
          <th>Data</th>
          <th>Status</th>
          <th>Observações</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tb-orc"></tbody>
    </table>
  </div>

</div>

<script src="../js/app.js"></script>
<script>
const STATUS_BADGE = {
  'EM_DIGITACAO':        'badge-gray',
  'ORCAMENTO_APROVADO':  'badge-green',
  'CONCLUIDO':           'badge-blue',
  'CANCELADO':           'badge-red',
};

async function load() {
  try {
    const data = await apiFetch('/orcamentos/json');
    const tbody = clearTable('tb-orc');
    const orcs = data.orcamentos || [];
    if (!orcs.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum orçamento criado</td></tr>';
      return;
    }
    orcs.forEach(o => {
      const cls = STATUS_BADGE[o.status] ?? 'badge-gray';
      appendRow('tb-orc', `
        <td class="td-mono" style="color:var(--muted)">#${o.id}</td>
        <td><strong>${o.titulo}</strong></td>
        <td style="color:var(--muted)">${o.dataCriacao}</td>
        <td><span class="badge ${cls}">${o.status}</span></td>
        <td style="color:var(--muted)">${o.observacoes || '—'}</td>
        <td class="actions">
          <button class="btn btn-ghost btn-sm" onclick="abrirOrc(${o.id})">Abrir</button>
          <button class="btn btn-danger btn-sm" onclick="deletarOrc(${o.id})">Deletar</button>
        </td>
      `);
    });
  } catch (e) {
    console.error(e);
    toast('Erro ao carregar orçamentos', 'error');
  }
}

document.getElementById('btn-add').addEventListener('click', async () => {
  const titulo = document.getElementById('orc-titulo').value.trim();
  const obs    = document.getElementById('orc-obs').value.trim();
  if (!titulo) { toast('Título é obrigatório', 'error'); return; }
  try {
    const res = await apiPost('/orcamentos/novo', {
      id: 0, titulo, dataCriacao: '', status: 'EM_DIGITACAO', observacoes: obs, ativo: true,
    });
    document.getElementById('orc-titulo').value = '';
    document.getElementById('orc-obs').value = '';
    toast('Orçamento criado');
    load();
  } catch (e) { toast('Erro ao criar: ' + e.message, 'error'); }
});

function abrirOrc(id) { location.href = `orcamento-detalhe.html?id=${id}`; }

async function deletarOrc(id) {
  if (!confirm('Confirma a exclusão?')) return;
  try {
    await apiFetch(`/orcamentos/deletar/${id}`);
    toast('Orçamento removido');
    load();
  } catch (e) { toast('Erro ao deletar', 'error'); }
}

load();
</script>
</body>
</html>
