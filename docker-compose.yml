# yaml-language-server: $schema=./.vscode/compose-spec.json
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - POSTGRES_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_PORT=5432
      - DB_NAME=precifiq_db
      - POSTGRES_DB=precifiq_db
      - DB_USER=precifiq_user
      - POSTGRES_USER=precifiq_user
      - DB_PASSWORD=${DB_PASSWORD:-p2QL+2Svy&3cQUaM}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-p2QL+2Svy&3cQUaM}
      - DB_SSLMODE=disable
      - DATABASE_URL=jdbc:postgresql://postgres:5432/precifiq_db?sslmode=disable&currentSchema=controle
      - DB_URL=jdbc:postgresql://postgres:5432/precifiq_db?sslmode=disable&currentSchema=controle
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      # Rota específica para a API
      - "traefik.http.routers.backend.rule=Host(`precifiq.dcsys.info`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
      - "traefik.docker.network=app-network"
      # Middleware para forçar o scheme HTTPS nos headers para o backend
      - "traefik.http.middlewares.backend-https-scheme.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.backend.middlewares=backend-https-scheme"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      # Rota principal para o frontend (qualquer coisa que não seja /api)
      - "traefik.http.routers.frontend.rule=Host(`precifiq.dcsys.info`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=app-network"
      - "traefik.http.middlewares.headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    profiles: ["db", "local-db"] # Não é deployado no fluxo padrão de CI/CD ou deploy da aplicação
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - precifiq-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  precifiq-app-network:
    name: precifiq-app-network
    driver: bridge

volumes:
  postgres-data:
