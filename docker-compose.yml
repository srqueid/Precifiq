services:
  postgres:
    image: postgres:15-alpine
    profiles:
      - db
    restart: unless-stopped
    command: postgres -p 5444
    environment:
      POSTGRES_DB: ${DB_NAME:-precifiq_db}
      POSTGRES_USER: ${DB_USER:-precifiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p2QL+2Svy&3cQUaM}
      PGPORT: "5444"
    ports:
      - "127.0.0.1:5444:5444"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - precifiq-app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p 5444 -U $${POSTGRES_USER:-precifiq_user} -d $${POSTGRES_DB:-precifiq_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-ep-winter-wildflower-ap91sljr-pooler.c-7.us-east-1.aws.neon.tech}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-neondb}
      - DB_USER=${DB_USER:-neondb_owner}
      - DB_PASSWORD=${DB_PASSWORD:-npg_OnP97uVYqigX}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - JDBC_DATABASE_URL=${JDBC_DATABASE_URL:-jdbc:postgresql://ep-winter-wildflower-ap91sljr-pooler.c-7.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
    restart: unless-stopped
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.precifiq-backend.rule=Host(`precifiq.dcsys.info`) && PathPrefix(`/api`)"
      - "traefik.http.routers.precifiq-backend.entrypoints=websecure"
      - "traefik.http.routers.precifiq-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.precifiq-backend.loadbalancer.server.port=8081"
      - "traefik.docker.network=precifiq-app-network"
      - "traefik.http.middlewares.precifiq-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.precifiq-backend.middlewares=precifiq-https"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - precifiq-app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.precifiq-frontend.rule=Host(`precifiq.dcsys.info`)"
      - "traefik.http.routers.precifiq-frontend.entrypoints=websecure"
      - "traefik.http.routers.precifiq-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.precifiq-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=precifiq-app-network"
      - "traefik.http.middlewares.precifiq-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.precifiq-frontend.middlewares=precifiq-https"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:80/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - precifiq-app-network

networks:
  precifiq-app-network:
    external: true

volumes:
  postgres-data:
