services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5444}
      - DB_NAME=${DB_NAME:-precifiq_db}
      - DB_USER=${DB_USER:-precifiq_user}
      - DB_PASSWORD=${DB_PASSWORD:-p2QL+2Svy&3cQUaM}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    restart: unless-stopped
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.precifiq-backend.rule=Host(`precifiq.dcsys.info`) && PathPrefix(`/api`)"
      - "traefik.http.routers.precifiq-backend.entrypoints=websecure"
      - "traefik.http.routers.precifiq-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.precifiq-backend.loadbalancer.server.port=8081"
      - "traefik.docker.network=precifiq-app-network"
      - "traefik.http.middlewares.precifiq-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.precifiq-backend.middlewares=precifiq-https"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - precifiq-app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.precifiq-frontend.rule=Host(`precifiq.dcsys.info`)"
      - "traefik.http.routers.precifiq-frontend.entrypoints=websecure"
      - "traefik.http.routers.precifiq-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.precifiq-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=precifiq-app-network"
      - "traefik.http.middlewares.precifiq-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.precifiq-frontend.middlewares=precifiq-https"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:80/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - precifiq-app-network

networks:
  precifiq-app-network:
    external: true
