server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Common proxy headers (inherited by all location blocks)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static assets (hashed filenames from Vite)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA navigation fallback: quando o navegador faz refresh (F5) ou navegação direta
    # com cabeçalho Accept: text/html (exceto páginas de impressão/relatório), serve o index.html
    # evitando que o backend retorne HTML legado sem estilo ou JSON bruto.
    set $spa_fallback 0;
    if ($http_accept ~* "text/html") {
        set $spa_fallback 1;
    }
    if ($uri ~* "(imprimir|relatorio)") {
        set $spa_fallback 0;
    }
    if ($spa_fallback = 1) {
        rewrite ^ /index.html last;
    }

    # --- API routes proxied to the Ktor backend ---
    # The backend listens on port 8081 inside the docker network.
    location /api {
        proxy_pass http://backend:8081;
    }

    location /unidades-medida {
        proxy_pass http://backend:8081;
    }

    location /pedidos-operacionais {
        proxy_pass http://backend:8081;
    }

    location /insumos {
        proxy_pass http://backend:8081;
    }

    location /fornecedores {
        proxy_pass http://backend:8081;
    }

    location /configuracoes {
        proxy_pass http://backend:8081;
    }

    location /compras {
        proxy_pass http://backend:8081;
    }

    location /clientes {
        proxy_pass http://backend:8081;
    }

    location /produtos-finais {
        proxy_pass http://backend:8081;
    }

    location /precificacao {
        proxy_pass http://backend:8081;
    }

    location /orcamentos {
        proxy_pass http://backend:8081;
    }

    location /pedidos-compra {
        proxy_pass http://backend:8081;
    }

    location /pedidos {
        proxy_pass http://backend:8081;
    }

    # Bare /pedidos and /compras are handled by the API (return JSON),
    # matching the dev proxy behaviour.
    location = /pedidos {
        proxy_pass http://backend:8081;
    }

    location = /compras {
        proxy_pass http://backend:8081;
    }

    # SPA fallback: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}