name: Deploy to Production Server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          script: |
            set -e
            cd /root/precifiq
            
            # 2. Grava o commit ATUAL em uma variável para ser usado caso necessite de Rollback
            # Se ainda não houver nenhum commit validado (primeiro deploy), usa HEAD
            PREV_COMMIT=$(git rev-parse --verify HEAD 2>/dev/null || echo "")
            echo "Commit de segurança antes do deploy: ${PREV_COMMIT}"
            
            # 3. Define função de Rollback em caso de falha no deploy
            rollback() {
              echo "❌ ERRO CRÍTICO NO DEPLOY! Os containers não ficaram saudáveis."
              if [ -n "$PREV_COMMIT" ]; then
                echo "⚠️ Iniciando ROLLBACK AUTOMÁTICO para o commit: ${PREV_COMMIT}..."
                git reset --hard "$PREV_COMMIT"
                
                # Sobe a versão anterior da aplicação rapidamente usando as imagens em cache
                docker compose up -d --remove-orphans --force-recreate backend frontend
                echo "✅ Rollback concluído com sucesso. A aplicação voltou ao estado anterior."
              else
                echo "⚠️ Não há commit anterior registrado para reverter."
              fi
              exit 1
            }
            
            # 4. Atualiza o código-fonte (Requer chave SSH no servidor sem passphrase!)
            git remote set-url origin "git@github.com:${{ github.repository }}.git"
            BRANCH_TO_PULL="${{ github.ref_name }}"
            git fetch origin "$BRANCH_TO_PULL"
            git reset --hard "origin/$BRANCH_TO_PULL"
            
            # Gera o arquivo .env correto (evitando expor no terminal em caso de erro)
            printf '%s\n' "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            # 5. Build antecipado dos serviços de aplicação sem causar downtime
            echo "🛠️ Construindo as novas imagens Docker (backend e frontend)..."
            docker compose build --pull backend frontend
            
            # 7. DEPLOY COM HEALTHCHECK + ROLLBACK CONDICIONAL
            # O '--wait' faz o Docker Compose segurar a execução por até 120s 
            # esperando os healthchecks do backend e frontend darem 'OK'.
            # O banco de dados NÃO é afetado por este comando.
            echo "🚀 Subindo novos containers da aplicação e aguardando testes de saúde..."
            docker compose up -d --remove-orphans --wait --wait-timeout 120 backend frontend || rollback
            
            # 8. Limpeza de cache e imagens antigas sem uso para economizar disco
            echo "🧹 Limpando imagens antigas sem uso..."
            docker image prune -f
            
            echo "✨ Deploy da aplicação finalizado e validado com sucesso!"
